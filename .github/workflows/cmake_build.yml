#
# CMake based build for Rustacity
#
# Contributor: Sadik Pranto <pranto.smss.dev@gmail.com>
#
name: CMake Build

#
# Only execute on "git push" actions
#
on:
  push:
    # Remove the "#" from the next 2 lines if you need to disable this action
    #branches:
    #  - disable
  pull_request:
    # Remove the "#" from the next 2 lines if you need to disable this action
    #branches:
    #  - disable
  # Runs the "Goldens" job (capture of DSP reference values) on its own,
  # without the platform builds, from the Actions tab.
  workflow_dispatch:

#
# Global environment variables
#
env:
  WXURL: https://github.com/audacity/wxWidgets
  # Pin the wx branch: upstream Audacity did the same in 2.4.2 after the
  # fork's master moved and broke the 2.4.1 sources (VSTControlOSX.mm).
  WXREF: audacity-fixes-3.1.3
  WXWIN: ${{ github.workspace }}/wxwin

#
# Define our job(s)
#
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # A manually dispatched run captures golden values only
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows_64bit",
            os: windows-2022,
            generator: "Visual Studio 17 2022",
            platform: "x64"
          }
        - {
            name: "Ubuntu_24.04",
            os: ubuntu-24.04,
            generator: "Unix Makefiles"
          }
        - {
            name: "macOS",
            os: macos-15-intel,
            generator: "Xcode"
          }

    steps:
    # =========================================================================
    # SHARED: Checkout source
    # =========================================================================
    - name: Checkout
      uses: actions/checkout@v7
    #  with:
    #    ref: main

    # =========================================================================
    # SHARED: Retrieve git hashes and set up for cache
    # =========================================================================
    - name: Setup cache
      shell: bash
      run: |
        set -x

        # Get latest wxWidgets commit hash
        wxhash=$(git ls-remote "${WXURL}" "${WXREF}" | awk 'NR==1 {print $1}')

        # Build the cache key
        wxhash="wx_${wxhash}_${RUNNER_OS}_${{matrix.config.platform}}"

        # Export the commit hash to further steps
        echo "WXHASH=${wxhash}" >> "$GITHUB_ENV"

        # Get the short hash
        shorthash=$(git show -s --format='%h')

        # Export the short hash for the upload step
        echo "SHORTHASH=${shorthash}" >> "$GITHUB_ENV"

        # Export the destination directory name
        echo "DEST=${{matrix.config.name}}_${shorthash}" >> "$GITHUB_ENV"

    # =========================================================================
    # SHARED: Create and/or retrieve wxWidgets cached build
    # =========================================================================
    - name: Populate cache
      id: cache
      uses: actions/cache@v6
      with:
        # Increment the number at the end to force recreation of the cache
        key: ${{ env.WXHASH }}.9
        path: ${{ env.WXWIN }}

    # =========================================================================
    # WINDOWS: Build (for all versions of Windows)
    # =========================================================================
    - name: Build for Windows
      if: startswith( matrix.config.os, 'windows' )
      shell: bash
      run: |
        set -x

        # The Rust DSP core is compiled by cargo during the CMake build;
        # install the target matching the MSVC platform first.
        rustup target add x86_64-pc-windows-msvc

        # Build wxWidgets if needed
        if [ ! -e "${WXWIN}" ]
        then
          # Clone the wxWidgets repo
          git clone --depth 1 --recurse-submodules -b "${WXREF}" "${WXURL}" "wxroot"

          # Use cmake since it defines the MSVC enviornment for us
          cmake -S "wxroot" \
                -B "wxroot" \
                -G "${{matrix.config.generator}}" \
                -A "${{matrix.config.platform}}"

          # Build
          cmake --build "wxroot" --config Release --verbose

          # Install to the cached path
          cmake --install "wxroot" --config Release --prefix "${WXWIN}"

          # On Windows, we need zlib for libid3tag
          mkdir -p "${WXWIN}/src"
          cp -a "wxroot/lib" "${WXWIN}/"
          cp -a "wxroot/src/zlib" "${WXWIN}/src"
        fi

        # Convert to CMake path
        export WXWIN="${WXWIN//\\//}"

        # Configure Rustacity
        #
        # The wxWidgets_USE_REL_AND_DBG is needed because,
        # on Github, we only build the Release version of
        # wxWidgets and the FindwxWidgets CMake module
        # defaults to looking for both.  If either of them
        # isn't found, then it doesn't provides the required
        # library information.  This is only a concern for
        # Windows.
        cmake -S . \
              -B build \
              -G "${{matrix.config.generator}}" \
              -A ${{matrix.config.platform}} \
              -D wxWidgets_USE_REL_AND_DBG=NO

        # Build Rustacity
        cmake --build build --config Release --verbose

        # "Install" Rustacity
        mkdir -p "${DEST}"
        cp -a build/bin/Release/* "${DEST}"
        rm -f "${DEST}"/{*.iobj,*.ipdb}

        # Create artifacts (archived as Github actions don't preserve
        # permissions, and as the release publishes a 7z)
        mkdir -p dist obj
        cmake -E tar c "dist/${GITHUB_SHA}.7z" --format=7zip "${DEST}"

        # The installers package the same tree, so a download holds one
        # program however it is installed.  The version inside them is the
        # one src/Rustacity.h declares, which is the number the application
        # reports; the release renames the files after the tag.
        TREE="$(cygpath -w "${PWD}/${DEST}")"
        OUT="$(cygpath -w "${PWD}/dist")"
        OBJ="$(cygpath -w "${PWD}/obj")\\"
        APP_VERSION=$(sed -n \
          -e 's/^#define RUSTACITY_VERSION[[:space:]]*\([0-9]\{1,\}\).*/\1/p' \
          -e 's/^#define RUSTACITY_RELEASE[[:space:]]*\([0-9]\{1,\}\).*/\1/p' \
          -e 's/^#define RUSTACITY_REVISION[[:space:]]*\([0-9]\{1,\}\).*/\1/p' \
          src/Rustacity.h | paste -sd.)

        # Inno Setup ships on the runner, and takes its options with a
        # leading slash, which the shell would otherwise read as a path.
        ISCC="$(command -v ISCC.exe || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
        MSYS2_ARG_CONV_EXCL='*' "${ISCC}" /Qp "/DReleaseDir=${TREE}" "/O${OUT}" \
          "$(cygpath -w "${PWD}/win/Inno_Setup_Wizard/rustacity.iss")"

        # WiX: the file list is harvested from the tree, everything else
        # is win/wix/rustacity.wxs.
        heat dir "${TREE}" -cg RustacityFiles -dr INSTALLFOLDER -srd -sreg -scom \
          -ag -var var.BuildDir -out "$(cygpath -w "${PWD}/obj/components.wxs")"
        candle -arch x64 "-dBuildDir=${TREE}" "-dProductVersion=${APP_VERSION}" \
          -out "${OBJ}" "$(cygpath -w "${PWD}/win/wix/rustacity.wxs")" \
          "$(cygpath -w "${PWD}/obj/components.wxs")"
        # ICE61 asks that an upgrade remove only older versions; this one
        # has to be able to remove the version it is installing, because
        # the application's version does not change between releases.
        light -sice:ICE61 -out "${OBJ}rustacity-win-${APP_VERSION}-x86_64.msi" \
          "$(cygpath -w "${PWD}/obj/rustacity.wixobj")" \
          "$(cygpath -w "${PWD}/obj/components.wixobj")"
        mv "obj/rustacity-win-${APP_VERSION}-x86_64.msi" dist/

    # =========================================================================
    # MACOS: Build (for all versions of MacOS)
    # =========================================================================
    - name: Build for macOS
      if: startswith( matrix.config.os, 'macos' )
      shell: bash
      run: |
        set -x

        # Setup environment
        export PATH="/usr/local/bin:${PATH}"
        export DYLD_LIBRARY_PATH="/usr/local/lib"

        # Install required packages
        brew install gettext
        brew link --force gettext

        # Build wxWidgets if needed
        if [ ! -e "${WXWIN}" ]
        then
          # Clone the wxWidgets repo
          git clone --depth 1 --recurse-submodules -b "${WXREF}" "${WXURL}" "wxroot"

          # Xcode 16.3+ / macOS 15.4+ SDKs removed <fp.h>, but the bundled
          # libpng's pngpriv.h includes it when TARGET_OS_MAC is defined
          # (which modern SDKs define transitively).  Use <math.h> instead,
          # exactly as upstream libpng 1.6.45+ does.
          sed -i '' 's|#      include <fp.h>|#      include <math.h>|' wxroot/src/png/pngpriv.h

          # Same trap in the bundled zlib: its classic-Mac block in zutil.h
          # is triggered by TARGET_OS_MAC and #define's fdopen away, which
          # breaks the <stdio.h> declaration on modern SDKs.
          sed -i '' 's@ || defined(TARGET_OS_MAC)@@' wxroot/src/zlib/zutil.h

          # Make sure our flags are included
          export CXX="g++ -std=c++1z -stdlib=libc++"
          export LD="g++ -std=c++1z -stdlib=libc++"

          # The cmake build produces an incorrect wx-config script, so use
          # the plain old configure/make
          cd wxroot
          ./configure --prefix=/usr/local \
                      --enable-debug=no \
                      --enable-macosx-arch="x86_64" \
                      --enable-shared=yes \
                      --enable-unicode=yes \
                      --enable-universal_binary=no \
                      --enable-webkit=no \
                      --enable-webviewwebkit=no \
                      --with-expat=builtin \
                      --with-flavour="release" \
                      --with-libjpeg=builtin \
                      --with-libpng=builtin \
                      --with-libtiff=builtin \
                      --with-macosx-version-min="10.7" \
                      --with-regex=builtin \
                      --with-zlib=builtin \
                      --without-liblzma

          # Build and install to cached path
          make -j $(sysctl -n hw.ncpu) install DESTDIR="${WXWIN}"

          # wx's configure-based `make install` only copies the file list
          # in $(ALL_HEADERS), which omits every header directory named
          # "private".  Our sources include <wx/osx/private.h>
          # (FileDialogPrivate.mm, KeyboardCapture.cpp, VSTControlOSX.h,
          # AUControl.h), and that header includes
          # wx/osx/private/datatransfer.h, so without this the compile
          # fails with "file not found".  Overlay the complete source
          # header tree so no header class is left out; the generated
          # setup.h is safe as configure puts it in lib/wx/include and
          # the source tree has no include/wx/setup.h.
          cp -a include/wx/. "${WXWIN}/usr/local/include/wx-3.1-release/wx/"
          cd ..

          # Clean up
          unset CXX LD
        fi

        # "Install" wxWidgets
        sudo cp -a "${WXWIN}"/usr/* /usr

        # Configure Rustacity
        #
        # Xcode 14+ rejects an empty code signing identity, and Github's
        # macOS runners have no signing certificates.  Disable signing so
        # the 'Command-line Tool' targets (mod-script-pipe, Wrapper) can
        # be built.
        cmake -S . \
              -B build \
              -G "${{matrix.config.generator}}" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

        # Build Rustacity
        cmake --build build --config Release

        # Create artifact
        #
        # The disk image holds the bundle and a link to the applications
        # folder, so installing is dragging one onto the other.  Only the
        # bundle goes in: build/bin/Release also holds a loose Wrapper, and
        # that is a copy of the one the bundle already runs as its
        # executable (Contents/MacOS/Wrapper).
        #
        # mac/Resources/Rustacity-DMG-background.png is the art for laying
        # the window out; it needs Finder scripting to place, so the image
        # is left plain for now.
        rm -rf dmgroot
        mkdir -p dmgroot dist
        cp -a build/bin/Release/Rustacity.app dmgroot/
        ln -s /Applications dmgroot/Applications
        hdiutil create -volname "Rustacity" -srcfolder dmgroot -ov \
          -format UDZO "dist/${GITHUB_SHA}.dmg"

    # =========================================================================
    # UBUNTU: Build (for all versions of Ubuntu)
    # =========================================================================
    - name: Build for Ubuntu
      if: startswith( matrix.config.os, 'ubuntu' )
      shell: bash
      run: |
        set -x

        # Setup environment
        export PATH="/usr/local/bin:${PATH}"
        export LD_LIBRARY_PATH="/usr/local/lib"

        # Install required packages
        #
        # squashfs-tools and desktop-file-utils are what appimagetool runs
        # to write the package: mksquashfs and desktop-file-validate.
        sudo apt-get update -y
        sudo apt-get install -y libgtk2.0-dev libasound2-dev gettext
        sudo apt-get install -y squashfs-tools desktop-file-utils
        sudo apt-get remove -y ccache

        # Build wxWidgets if needed
        if [ ! -e "${WXWIN}" ]
        then
          # Clone the wxWidgets repo
          git clone --depth 1 --recurse-submodules -b "${WXREF}" "${WXURL}" "wxroot"

          # Install additional required package
          sudo apt-get install -y autoconf automake

          # The cmake build produces an incorrect wx-config script, so use
          # the plain old configure
          cd wxroot
          ./configure --with-gtk

          # Build and install to cached path
          make -j $(nproc) install DESTDIR="${WXWIN}"
          cd ..
        fi

        # "Install" wxWidgets
        sudo cp -a "${WXWIN}"/* /

        # Configure Rustacity
        cmake -S . \
              -B build \
              -G "${{matrix.config.generator}}"

        # Build Rustacity
        cmake --build build --config Release

        # "Install" Rustacity into an AppDir
        #
        # The tree CMake installs is already the tree a Linux installation
        # wants - bin/, lib/, share/applications, share/icons, share/mime -
        # so the AppDir is that tree under usr/, with the three entries the
        # format reads at its root: the desktop file, the icon it names, and
        # AppRun.
        APPDIR="rustacity.AppDir"
        rm -rf "${APPDIR}"
        cmake --install build --config Release --prefix "${APPDIR}/usr"

        # The Rust DSP core has to be linked in, not merely built: the C++
        # side calls it, and an unreferenced archive member is dropped from
        # the link, so a symbol that is present proves the core is used.
        # (Checked on Linux only - the check is about the shared CMake
        # wiring, and nm is not available on the Windows runners.)
        if ! nm "${APPDIR}/usr/bin/rustacity" | grep -q "rustacity_biquad_design_butterworth"
        then
          echo "::error::The Rust DSP core is not linked into ${APPDIR}/usr/bin/rustacity"
          nm "${APPDIR}/usr/bin/rustacity" | grep -i rustacity_ || true
          exit 1
        fi

        # wxWidgets, beside the binary, where AppRun points the loader
        mkdir -p "${APPDIR}/usr/lib"
        ldd "${APPDIR}/usr/bin/rustacity"
        for lib in $(ldd "${APPDIR}/usr/bin/rustacity" | awk '/libwx/{print $3}')
        do
           echo "${lib}"
           ldd "${lib}" | awk '/libwx/{print $3}'
        done | sort -u | xargs cp -n -H -t "${APPDIR}/usr/lib"

        cp "${APPDIR}/usr/share/applications/rustacity.desktop" "${APPDIR}/"
        cp "${APPDIR}/usr/share/icons/hicolor/48x48/rustacity.png" "${APPDIR}/rustacity.png"

        # AppRun starts the application from wherever the image is mounted,
        # the way the wrapper script started it from the unpacked tree.
        cat >"${APPDIR}/AppRun" <<"EOF"
        #!/bin/sh
        HERE=$(dirname "$(readlink -f "$0")")
        export LD_LIBRARY_PATH="${HERE}/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "${HERE}/usr/bin/rustacity" "$@"
        EOF
        chmod +x "${APPDIR}/AppRun"

        # Create artifact
        #
        # appimagetool is run out of its own image, as the runners have no
        # FUSE to mount it with.
        curl -fsSL -o appimagetool \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        mkdir -p dist
        ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
          ./appimagetool "${APPDIR}" "dist/${GITHUB_SHA}.AppImage"

    # =========================================================================
    # SHARED: Attach the packages to the workflow results
    # =========================================================================
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.config.name }}_${{ env.SHORTHASH }}
        path: dist/*

  # =========================================================================
  # RUST: Unit tests for the Rustacity Rust workspace (fast, independent)
  # =========================================================================
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The extension tests build their own WebAssembly fixtures before they
      # run, so this target is needed here as well as in the extensions job.
      - name: Add the WebAssembly target
        run: rustup target add wasm32-wasip1

      - name: Run cargo tests
        working-directory: rust
        run: cargo test --workspace

      # The hand-written header in rust/dsp/include must keep declaring
      # exactly what the Rust core exports (scripts/check_dsp_abi.py).
      - name: Check the DSP ABI against its header
        run: python3 scripts/check_dsp_abi.py

  # =========================================================================
  # DSP: Capture reference values from the original C++ implementations
  #
  # The dumpers in rust/dsp/goldens/capture/ compile one wx-free DSP unit
  # of src/ on its own and print the values the Rust port has to reproduce
  # (the capture step of the porting rule in rust/README.md).  What they
  # print is checked in as rust/dsp/goldens/reference.txt, so this job is
  # only interesting while a port is in progress; with no dumper in the
  # tree it does nothing.
  # =========================================================================
  goldens:
    name: Goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and run the dumpers
        run: |
          shopt -s nullglob
          mkdir -p out
          for src in rust/dsp/goldens/capture/*.cpp
          do
            name=$(basename "${src}" .cpp)
            echo "::group::${name}"
            # A dumper that needs more than its own header to compile names the
            # extra source files on a line of its own: "// capture-sources: ..."
            extra=$(sed -n 's|^// capture-sources:||p' "${src}" | head -n 1)
            g++ -std=c++17 -O2 -Wall -Wextra -Isrc -Isrc/effects \
              -o "/tmp/${name}" "${src}" ${extra}
            "/tmp/${name}" | tee "out/${name}.txt"
            echo "::endgroup::"
          done

      - name: Upload the captured values
        uses: actions/upload-artifact@v7
        with:
          name: golden-values
          path: out/
          if-no-files-found: ignore

  # =========================================================================
  # EXTENSIONS: the WebAssembly extension engine, and the extensions it runs
  #
  # rust/extensions is a workspace of its own and is excluded from rust/, so
  # that the cargo build inside the CMake build never builds wasm crates and a
  # compiler upgrade for wasm cannot break the editor.  That also means a plain
  # `cargo test --workspace` does not check the extensions' own code: this job
  # does, as well as the engine's lint and format gates, which are scoped to
  # the new crates because rust/dsp has lints from before this work (see
  # docs/extensions/INTEGRATION_NOTES.md).
  # =========================================================================
  extensions:
    name: Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add the WebAssembly target
        run: rustup target add wasm32-wasip1

      # Every module in rust/extensions/variants.txt, laid out as installable
      # extension directories under rust/extensions/dist.
      - name: Build the extensions
        run: scripts/build-extensions.sh

      # rust/ext-host/include/rustacity_ext.h is written by hand and has to
      # keep declaring what rust/ext-host/src/ffi.rs exports.
      - name: Check the extension ABI against its header
        run: python3 scripts/check_ext_abi.py

      - name: Clippy
        working-directory: rust
        run: >
          cargo clippy
          -p rustacity-ext-api -p rustacity-ext-host -p rustacity-ext-cli
          --all-targets -- -D warnings

      - name: Formatting
        working-directory: rust
        run: >
          cargo fmt
          -p rustacity-ext-api -p rustacity-ext-host -p rustacity-ext-cli
          --check

      - name: Clippy, for the extensions themselves
        working-directory: rust/extensions
        run: cargo clippy --workspace --all-targets --target wasm32-wasip1 -- -D warnings

      - name: Formatting, for the extensions themselves
        working-directory: rust/extensions
        run: cargo fmt --all --check

  # =========================================================================
  # CLI: the extension engine's command-line tool and the example extensions
  #
  # What someone can try without building the editor: one Linux binary (plain
  # Rust, nothing platform-specific in it) beside the extensions
  # rust/extensions/variants.txt describes, the sample and the checker from
  # examples/, and the three contract documents.  It is also the repository's
  # own check that the quick start in README.md still works: the run below is
  # that sequence, on the committed sample.  The release job renames the
  # archive and publishes it beside the installers.
  # =========================================================================
  cli:
    name: CLI artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add the WebAssembly target
        run: rustup target add wasm32-wasip1

      - name: Build the command-line tool
        working-directory: rust
        run: cargo build --release -p rustacity-ext-cli

      - name: Build the extensions
        run: scripts/build-extensions.sh

      # The quick start, run where it is written down.  The generated sample
      # has to equal the committed one byte for byte: if that drifts, the
      # checker and the documentation describe a file that is gone.
      - name: Run the quick start
        run: |
          set -eux
          ./rust/target/release/rustacity-ext-cli --describe rust/extensions/dist/gain-invert
          python3 examples/make-sine-sweep.py /tmp/sine-sweep.wav
          cmp examples/sine-sweep.wav /tmp/sine-sweep.wav
          ./rust/target/release/rustacity-ext-cli rust/extensions/dist/gain-invert \
            /tmp/sine-sweep.wav /tmp/gained.wav --param gain_db=6
          python3 examples/check-output.py /tmp/sine-sweep.wav /tmp/gained.wav --gain-db 6

      - name: Package
        run: |
          set -eux
          staging="rustacity-cli"
          mkdir -p "${staging}/extensions"
          cp rust/target/release/rustacity-ext-cli "${staging}/"
          cp -r rust/extensions/dist/. "${staging}/extensions/"
          cp -r examples "${staging}/examples"
          cp docs/extensions/API.md docs/extensions/SANDBOX.md \
             docs/extensions/WRITING_AN_EXTENSION.md "${staging}/"
          mkdir -p dist
          tar -czf "dist/${GITHUB_SHA}.tar.gz" "${staging}"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: CLI_Linux
          path: dist/*

  # =========================================================================
  # SHARED: Publish a GitHub Release when a tag is pushed
  #
  # The release is created with the RELEASE_TOKEN repository secret, which
  # must be able to write this repository's contents.
  # =========================================================================
  release:
    name: Publish Release
    # Only run for tag pushes, after the build matrix, the Rust tests and the
    # extension engine have succeeded
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, rust-test, extensions, cli ]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only reads the workflow's artifacts here; the release
    # itself is published with RELEASE_TOKEN below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Require the RELEASE_TOKEN secret
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set, so the release cannot be published."
            echo "Add the RELEASE_TOKEN repository secret with write access to this repository's contents."
            exit 1
          fi

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#rustacity-}"
          TITLE="Rustacity ${VERSION}"
          # A package says what it is by its name: the archives carry the
          # commit they were built from, the installers the version inside
          # them.  Both are the build's business, so each one is renamed
          # here to the name it is published under, and a package the map
          # does not know fails the release rather than being published as
          # it stands.  Windows ships an archive and two installers, Linux
          # an AppImage and the command-line tool's archive, macOS a dmg;
          # two packages of one kind is a mistake as well, so a published
          # name may only be claimed once.
          mkdir -p assets
          while IFS= read -r f; do
            case "$(basename "$f")" in
              *.7z)                suffix="win-${VERSION}-x86_64.7z" ;;
              *.msi)               suffix="win-${VERSION}-x86_64.msi" ;;
              rustacity-win-*.exe) suffix="win-${VERSION}-x86_64.exe" ;;
              *.dmg)               suffix="macOS-${VERSION}-x86_64.dmg" ;;
              *.AppImage)          suffix="linux-${VERSION}-x86_64.AppImage" ;;
              *.tar.gz)            suffix="cli-linux-${VERSION}-x86_64.tar.gz" ;;
              *)
                echo "::error::No release asset name is defined for '$(basename "$f")'"
                exit 1
                ;;
            esac
            asset="assets/rustacity-${suffix}"
            if [ -e "${asset}" ]; then
              echo "::error::More than one package claims '$(basename "${asset}")'"
              exit 1
            fi
            cp "$f" "${asset}"
          done < <(find dist -type f | sort)

          # The tree the tag names, beside the binaries built from it.  This
          # is not the source archives GitHub attaches by itself: they are
          # generated from the tag as well, but this one is named with the
          # release, as the platform assets are.
          git archive --format=tar --prefix="rustacity-${VERSION}/" HEAD \
            | xz -T0 > "assets/rustacity-sources-${VERSION}.tar.xz"

          # Checksums for everything the release carries, made after the
          # names are final so that each line names the file it belongs to.
          ( cd assets && sha256sum -- * > SHA256SUMS )

          FILES=(assets/*)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "${FILES[@]}"
          else
            gh release create "${TAG}" --verify-tag --title "${TITLE}" \
              --generate-notes "${FILES[@]}"
          fi

