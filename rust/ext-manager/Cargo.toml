#
# The extension manager.  It owns the extensions directory - saying what is
# installed, turning one on or off, and asking the host whether one still
# loads.  This crate is that work and nothing else: no GUI dependency, so it
# builds, runs and tests like any other host tool.  The window that drives it
# is rust/ext-manager-gui, which links it.

[package]
name = "rustacity-ext-manager"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Lists and manages the extensions installed for Rustacity"
publish = false

[lib]
name = "rustacity_ext_manager"
path = "src/lib.rs"

[[bin]]
name = "rustacity-ext-manager"
path = "src/main.rs"

[dependencies]
rustacity-ext-api = { path = "../ext-api" }
rustacity-ext-host = { path = "../ext-host" }
thiserror = "2"
