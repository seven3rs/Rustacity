[package]
name = "rustacity-dsp"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "DSP core of Rustacity: the filters, the effects' signal processing, EBU R128 loudness, the FFT and the window functions"
publish = false

[lib]
name = "rustacity_dsp"
# "staticlib" is linked into the C++ application, "rlib" is what the
# test suite builds against.
crate-type = ["staticlib", "rlib"]
