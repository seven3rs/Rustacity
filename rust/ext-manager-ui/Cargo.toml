#
# The extension manager's interface: an egui program that builds to
# WebAssembly and runs in a browser.  It is a separate workspace, like
# rust/extensions and for the same reason - building the host never builds it,
# and building it never builds the host.
#
# It talks to rustacity-ext-manager over HTTP on the loopback interface; the
# manager serves the built directory at / and answers the API under /api/.
# scripts/build-manager-ui.sh builds this and puts the result where the
# manager looks for it.

[workspace]

[package]
name = "rustacity-ext-manager-ui"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The Rustacity extension manager's interface, as a WebAssembly program"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Headers",
    "HtmlCanvasElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
