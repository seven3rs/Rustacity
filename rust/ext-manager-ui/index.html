  The page the extension manager serves.  It exists to give the WebAssembly
  program a canvas and to call its entry point; everything the window shows is
  drawn by egui inside it.  The module it loads is built by
  scripts/build-manager-ui.sh, which also copies this file into the directory
  the manager serves.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustacity extension manager</title>
<!-- No icon: without this the browser asks for /favicon.ico and gets the
     server's honest 404, which shows up as an error in the console. -->
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1b1b1b; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #failure { color: #d76e6e; font: 14px/1.5 monospace; padding: 1em; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="the-canvas"></canvas>
<div id="failure"></div>
<script type="module">
  import init, { start } from './rustacity-ext-manager-ui.js';

  function failed(error) {
    document.getElementById('failure').textContent =
      'The extension manager interface did not start: ' + error;
  }

  try {
    await init();
    await start(document.getElementById('the-canvas'));
  } catch (error) {
    failed(error);
  }
</script>
</body>
</html>
