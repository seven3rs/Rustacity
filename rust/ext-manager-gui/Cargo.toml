#
# The extension manager's window: egui, drawn natively, in the same process as
# the code that reads and changes the extensions directory.  It is a binary of
# its own rather than part of rustacity-ext-manager so that the library and its
# tests do not depend on a GUI toolkit.

[package]
name = "rustacity-ext-manager-gui"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The window of the Rustacity extension manager"
publish = false

[[bin]]
name = "rustacity-ext-manager-gui"
path = "src/main.rs"

[dependencies]
rustacity-ext-manager = { path = "../ext-manager" }
# glow rather than wgpu: OpenGL is what every desktop has, and it is the
# smaller of the two backends.  x11 and wayland are only meaningful on Linux
# and are no-ops elsewhere.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
